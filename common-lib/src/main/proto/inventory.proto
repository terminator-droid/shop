syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package com.example.grpc.inventory;

option java_multiple_files = true;
option java_package = "com.example.grpc";
option java_outer_classname = "InventoryServerGrpcProto";

service InventoryService {
  rpc CheckAvailability (ProductsRequest) returns (ProductsResponse) {};
  rpc WriteOff (ProductsWriteOffRequest) returns (ProductsWriteOffResponse) {};
}

message ProductWriteOffResponse {
  string id = 1;
}

message ProductsWriteOffResponse {
  repeated ProductWriteOffResponse products = 1;
}

message ProductsWriteOffRequest {
  repeated ProductWriteOffRequest products = 1;
}

message ProductWriteOffRequest {
  string id = 1;
  int32 quantity = 2;
}

message ProductRequest {
  string id = 1;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  double sale = 5;
}
message ProductsResponse {
  repeated ProductResponse products = 1;
}

message ProductsRequest {
  repeated ProductRequest products = 1;
}