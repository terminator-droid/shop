databaseChangeLog:
  - changeSet:
      id: 004-create-refresh-tokens-table
      author: duss
      preConditions:
        - not:
            - tableExists:
                tableName: refresh_tokens
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID DEFAULT gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-add-fk-tokens-users
      author: duss
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_tokens_users
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id