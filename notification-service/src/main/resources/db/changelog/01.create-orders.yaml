databaseChangeLog:
  - changeSet:
      id: 0
      author: daniil
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp